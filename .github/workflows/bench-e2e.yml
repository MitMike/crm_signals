name: Bench Integration and E2E

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: bench-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bench-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - frappe_branch: version-15
            python-version: "3.11"
            run_e2e: false
          - frappe_branch: version-16
            python-version: "3.14"
            run_e2e: true

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Add test hostname
        run: echo "127.0.0.1 test.local" | sudo tee -a /etc/hosts

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install MariaDB client
        run: sudo apt-get update && sudo apt-get install -y mariadb-client

      - name: Configure MariaDB client defaults
        run: |
          sudo mkdir -p /etc/mysql/mariadb.conf.d
          printf '[client]\nskip-ssl\n[mysql]\nskip-ssl\n[mariadb]\nskip-ssl\n' | sudo tee /etc/mysql/mariadb.conf.d/99-ci-client.cnf
          mariadb --skip-ssl --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --skip-ssl --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Initialize Bench
        run: |
          uv tool install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --frappe-branch "${{ matrix.frappe_branch }}" --python "$(which python)" ~/frappe-bench

      - name: Get ERPNext and CRM Signals
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app --skip-assets erpnext https://github.com/frappe/erpnext --branch "${{ matrix.frappe_branch }}"
          bench get-app --skip-assets crm_signals "${{ github.workspace }}"
          bench setup requirements --dev

      - name: Create site and install apps
        working-directory: /home/runner/frappe-bench
        env:
          CI: "Yes"
        run: |
          bench new-site --db-root-password root --admin-password admin test.local
          bench --site test.local install-app erpnext
          bench --site test.local install-app crm_signals
          bench --site test.local set-config allow_tests true
          bench --site test.local set-config host_name "http://test.local:8000"
          bench --site test.local migrate

      - name: Exercise upgrade from the pre-event-identity CRM Signal schema
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test.local execute crm_signals.ci.prepare_upgrade_site
          bench --site test.local migrate
          bench --site test.local execute crm_signals.ci.verify_upgrade_site

      - name: Generate ephemeral E2E user passwords
        if: ${{ matrix.run_e2e }}
        id: e2e_credentials
        shell: bash
        run: |
          sales_password="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          employee_password="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          echo "::add-mask::$sales_password"
          echo "::add-mask::$employee_password"
          echo "sales_password=$sales_password" >> "$GITHUB_OUTPUT"
          echo "employee_password=$employee_password" >> "$GITHUB_OUTPUT"

      - name: Complete ERPNext setup and create E2E users
        if: ${{ matrix.run_e2e }}
        working-directory: /home/runner/frappe-bench
        env:
          E2E_SALES_PASSWORD: ${{ steps.e2e_credentials.outputs.sales_password }}
          E2E_EMPLOYEE_PASSWORD: ${{ steps.e2e_credentials.outputs.employee_password }}
        run: bench --site test.local execute crm_signals.ci.prepare_e2e_site

      - name: Build application assets
        working-directory: /home/runner/frappe-bench
        run: bench build

      - name: Run Python tests in the Bench environment
        working-directory: /home/runner/frappe-bench/apps/crm_signals
        run: |
          ../../env/bin/pip install pytest pytest-cov
          ../../env/bin/python -m pytest -q tests --cov=crm_signals --cov-report=term-missing

      - name: Run Frappe integration tests
        working-directory: /home/runner/frappe-bench
        run: bench --site test.local run-tests --app crm_signals

      - name: Install Playwright browser
        if: ${{ matrix.run_e2e }}
        working-directory: ${{ github.workspace }}
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Start Frappe for browser tests
        if: ${{ matrix.run_e2e }}
        working-directory: /home/runner/frappe-bench
        run: |
          sed -i 's/^watch:/# watch:/g' Procfile
          sed -i 's/^schedule:/# schedule:/g' Procfile
          bench start > bench_start.log 2>&1 &
          echo $! > bench_start.pid
          echo "Waiting for test.local..."
          timeout 90 bash -c 'until curl -s -H "Host: test.local" http://127.0.0.1:8000 >/dev/null; do sleep 2; done'
          echo "Frappe is ready."

      - name: Run Playwright E2E
        if: ${{ matrix.run_e2e }}
        working-directory: ${{ github.workspace }}
        env:
          BASE_URL: http://test.local:8000
          FRAPPE_USER: Administrator
          FRAPPE_PASSWORD: admin
          E2E_SALES_USER: e2e-sales-user@example.com
          E2E_SALES_PASSWORD: ${{ steps.e2e_credentials.outputs.sales_password }}
          E2E_EMPLOYEE_USER: e2e-employee@example.com
          E2E_EMPLOYEE_PASSWORD: ${{ steps.e2e_credentials.outputs.employee_password }}
          CI: "true"
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ always() && matrix.run_e2e }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Show Bench logs on failure
        if: failure()
        working-directory: /home/runner/frappe-bench
        run: |
          echo "=== Bench start log ==="
          cat bench_start.log || true
          echo "=== Frappe logs ==="
          cat logs/*.log || true
