name: Security Scanning

on:
  push:
    branches: ["main", "develop", "feature/**", "fix/**", "security/**"]
  pull_request:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep static security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - name: Scan Python application code
        run: semgrep scan --error --config p/python --config p/security-audit --sarif --output semgrep.sarif crm_signals
      - name: Upload Semgrep findings
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
