name: Quality Checks

on:
  push:
  pull_request:

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Validate editable package install
        run: python -m pip install -e .
      - name: Compile application
        run: python -m compileall -q crm_signals
      - name: Check Desk page JavaScript syntax
        run: |
          node --check crm_signals/crm_signals/page/crm_signals_dashboard/crm_signals_dashboard.js
          node --check crm_signals/crm_signals/page/sahdev_dashboard/sahdev_dashboard.js
      - name: Run tests
        run: python -m pytest -q
