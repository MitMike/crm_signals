name: Quality Checks

on:
  push:
  pull_request:

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed test surfaces
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      javascript: ${{ steps.filter.outputs.javascript }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'crm_signals/**/*.py'
              - 'tests/**/*.py'
              - 'scripts/**/*.py'
              - 'pyproject.toml'
              - 'setup.py'
            javascript:
              - 'package.json'
              - 'package-lock.json'
              - 'eslint.config.mjs'
              - 'playwright.config.ts'
              - 'e2e/**'
              - 'crm_signals/**/*.js'
              - 'crm_signals/**/*.ts'
              - 'crm_signals/**/*.css'
              - 'crm_signals/**/*.html'

  lint:
    needs: changes
    name: Lint and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Ruff
        run: python -m pip install --upgrade pip ruff==0.8.1 pyyaml==6.0.2
      - name: Python lint
        run: ruff check crm_signals tests scripts
      - name: Enforce file and function size standards
        run: python scripts/check_code_standards.py
      - name: Verify committed npm lockfile
        run: |
          test -s package.json
          test -s package-lock.json
          node -e "const lock = require('./package-lock.json'); if (lock.lockfileVersion < 1) process.exit(1); console.log('npm lockfile v' + lock.lockfileVersion)"
      - name: Install JavaScript tooling from the committed lockfile
        if: github.event_name != 'pull_request' || needs.changes.outputs.javascript == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify patched dependency versions
        if: github.event_name != 'pull_request' || needs.changes.outputs.javascript == 'true'
        run: npm ls @playwright/test eslint minimatch --all
      - name: ESLint and Oxlint
        if: github.event_name != 'pull_request' || needs.changes.outputs.javascript == 'true'
        run: npm run lint:js
      - name: Check formatting of tooling and E2E tests
        if: github.event_name != 'pull_request' || needs.changes.outputs.javascript == 'true'
        id: format_check
        run: npm run format:check
      - name: Print exact Prettier diff when formatting fails
        if: failure() && steps.format_check.outcome == 'failure'
        run: |
          mapfile -d '' files < <(find e2e -type f -name '*.ts' -print0)
          files+=(eslint.config.mjs playwright.config.ts)
          for file in "${files[@]}"; do
            formatted="$(mktemp)"
            npx prettier "$file" > "$formatted"
            if ! cmp -s "$file" "$formatted"; then
              echo "::group::Prettier diff: $file"
              diff -u --label "$file (committed)" --label "$file (Prettier output)" "$file" "$formatted" || true
              echo "::endgroup::"
            fi
            rm -f "$formatted"
          done
      - name: Compile Python
        run: python -m compileall -q crm_signals tests scripts
      - name: Validate JSON, YAML and TOML
        run: |
          python - <<'PY'
          import json
          import tomllib
          from pathlib import Path
          import yaml

          for path in Path(".").rglob("*.json"):
              if "node_modules" not in path.parts:
                  json.loads(path.read_text())
          tomllib.loads(Path("pyproject.toml").read_text())
          for path in [Path(".github/workflows/quality.yml"), Path(".github/workflows/bench-e2e.yml"), Path(".pre-commit-config.yaml")]:
              if path.exists():
                  yaml.safe_load(path.read_text())
          print("Configuration files are valid")
          PY

  unit-execution:
    name: Python unit execution (${{ matrix.python-version }})
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pytest-cov
      - name: Validate editable package install
        run: python -m pip install -e .
      - name: Compile application
        run: python -m compileall -q crm_signals tests scripts
      - name: Run tests with coverage
        run: python -m pytest -q --cov=crm_signals --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  python-310-required:
    name: Python unit tests (3.10)
    needs: [changes, unit-execution]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require execution when Python files changed
        if: (github.event_name != 'pull_request' || needs.changes.outputs.python == 'true') && needs.unit-execution.result != 'success'
        run: exit 1

  python-311-required:
    name: Python unit tests (3.11)
    needs: [changes, unit-execution]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require execution when Python files changed
        if: (github.event_name != 'pull_request' || needs.changes.outputs.python == 'true') && needs.unit-execution.result != 'success'
        run: exit 1

  python-312-required:
    name: Python unit tests (3.12)
    needs: [changes, unit-execution]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require execution when Python files changed
        if: (github.event_name != 'pull_request' || needs.changes.outputs.python == 'true') && needs.unit-execution.result != 'success'
        run: exit 1

  python-314-required:
    name: Python unit tests (3.14)
    needs: [changes, unit-execution]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require execution when Python files changed
        if: (github.event_name != 'pull_request' || needs.changes.outputs.python == 'true') && needs.unit-execution.result != 'success'
        run: exit 1

