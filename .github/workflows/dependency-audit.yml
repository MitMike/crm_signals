name: Dependency Security Audit

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/dependabot.yml"
      - ".github/workflows/dependency-audit.yml"
  schedule:
    - cron: "23 9 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-dependencies:
    name: Python dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install project and audit tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pip-audit
      - name: Audit installed Python environment
        run: pip-audit --local --progress-spinner off

  npm-dependencies:
    name: npm dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Audit npm dependencies
        run: npm audit --audit-level=moderate
