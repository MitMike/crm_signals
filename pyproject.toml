[project]
name = "crm_signals"
description = "Real-time event signals and daily CRM digests for ERPNext"
authors = [{ name = "Mithilesh Bansod" }]
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# Frappe Pilot and Frappe Cloud use this to check bench compatibility.
[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"

# Python linting and formatting rules aligned with Frappe Guard.
[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = [
  "B017", "B018", "B023", "B904",
  "E402", "E501", "F401", "F403", "F405",
  "UP030", "UP031", "UP032", "UP037", "UP040"
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
