[project]
name = "crm_signals"
description = "Real-time event signals and daily CRM digests for ERPNext"
authors = [{ name = "Mithilesh Bansod" }]
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# Frappe Pilot and Frappe Cloud use this to check bench compatibility.
[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"


[tool.ruff]
line-length = 110
target-version = "py310"
exclude = ["**/boilerplate/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
