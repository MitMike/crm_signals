repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: ^(eslint\.config\.mjs|playwright\.config\.ts|e2e/.*\.ts)$
        additional_dependencies: [prettier@3.2.5]

  - repo: local
    hooks:
      - id: code-standards
        name: Source file and Python function size standards
        entry: python scripts/check_code_standards.py
        language: system
        types: [file]
